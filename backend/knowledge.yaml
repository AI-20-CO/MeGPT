experience:
  positions:
    - title: "Software Engineering Intern"
      company: "Experian PLC"
      period: "September 2025 - Present"
      location: "Cyberjaya, Malaysia"
      description: "Working on enterprise-scale microservices, cloud infrastructure, and CI/CD pipelines"
      highlights:
        - "Resolved Hazelcast instability during Karpenter node replacement, reducing downtime from ~60s to ~1s (~98% reduction) while restoring cache across database-backed microservices. Solution presented to and accepted by the Global Head of SRE for implementation."
        - "Migrated 35+ legacy RMI endpoints to Spring Boot REST APIs to support the Java 17 to Java 21 upgrade, achieving 100% unit test coverage across migrated modules and improving service maintainability."
        - "Designed and implemented a centralized REST request-processing framework that standardizes payload validation, parsing, IO exception propagation, stack-trace preservation, and business exception handling via an abstract base class with lambda-based hooks, eliminating 1500+ lines of duplicated logic and reducing endpoint implementation effort by ~70%."
        - "Built parameterized Jenkins CI/CD pipelines supporting release-candidate (RC) workflows with selectable unit, integration, and sanity test suites, enforcing SonarQube quality gates, producing versioned release tags, publishing JAR/Docker artifacts, and enabling optional deployment to EC2 staging with post-deploy smoke checks."
        - "Improved service resilience by tuning startup, readiness, and liveness probes, reducing traffic routed to unready pods by ~79% during deployments and node transitions."
        - "Provisioned and validated deployments on AWS EKS, configuring node selectors and persona mappings to stabilize service scheduling and runtime behavior."

