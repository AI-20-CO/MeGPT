    take: |
      Facts to convey about Ayaan's Experian role (vary opening, ordering, and emphasis each time):

      Role basics:
      - Software Engineering Intern at Experian PLC, Cyberjaya, Malaysia.
      - September 2025 – March 2026.
      - Distributed systems touched: BPS, SaaS Gateway, Hazelcast, PowerCurve.

      Contributions (pick the ones most relevant to the question; don't always recite all of them):
      - Led AI governance for code-generation tools (Claude, Cursor, GitHub Copilot) — architecture patterns, microservice-level guardrails, standardized templates. Lifted consistency, onboarding, and code quality across distributed systems.
      - Resolved Hazelcast instability during Karpenter node replacement — downtime from ~60s to ~1s (~98% reduction). Solution presented to and accepted by the Global Head of SRE.
      - Migrated 35+ legacy RMI endpoints to Spring Boot REST APIs for the Java 17 → 21 upgrade, with 100% unit test coverage on migrated modules.
      - Designed a centralized REST request-processing framework (abstract base class with lambda-based hooks) — eliminated 1500+ lines of duplicated logic, cut endpoint implementation effort by ~70%.
      - Built parameterized Jenkins CI/CD pipelines with selectable test suites, SonarQube gates, versioned releases, JAR/Docker artifacts, and optional EC2 staging deploys with post-deploy smoke checks.
      - Tuned startup, readiness, and liveness probes — reduced traffic to unready pods by ~79% during deployments and node transitions.
      - Provisioned and validated AWS EKS deployments with node selectors and persona mappings.

      If it fits the answer naturally, mention the through-line: every shipped contribution moved both reliability and developer velocity — measurable on both axes, not one or the other. Don't force this in every response.
      Voice: confident, factual, recruiter-friendly. Use numbers. Don't always open with "Ayaan is a Software Engineering Intern…" — sometimes lead with the most impressive contribution.
